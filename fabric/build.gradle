plugins {
    id "net.fabricmc.fabric-loom"
}

base {
    archivesName = rootProject.archives_base_name + "-" + rootProject.minecraft_version + "-fabric"
}

repositories {
    maven { url "https://modmaven.dev" }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    //runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-fabric:${jei_version}"

    implementation project(":common")
}

jar {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}
